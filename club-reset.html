<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Passwort zurücksetzen · ACY Club</title>
  <link rel="stylesheet" href="styles.css?v=11.5.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/pet-companion.js?v=7.2.0" defer></script>
  <script src="club-reset.js?v=3.5.1" defer></script>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="shortcut icon" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">
</head>
<body class="club-auth-page">
  <div class="club-auth-shell">
    <header class="club-auth-header">
      <a class="brand" href="/"><span class="brand-mark">A</span><strong>ACY<span>JANNIK</span></strong></a>
      <a class="button button-secondary" href="/club.html">Zum Login</a>
    </header>

    <main class="club-reset-main">
      <section class="club-auth-card club-reset-card">
        <div class="eyebrow">ACY CLUB</div>
        <h1>Neues Passwort</h1>
        <p class="club-auth-muted" id="reset-intro">Lege hier dein neues Passwort fest.</p>

        <form id="reset-form" class="club-auth-form">
          <label>Neues Passwort
            <input id="new-password" type="password" minlength="10" autocomplete="new-password" placeholder="Mindestens 10 Zeichen" required>
          </label>
          <label>Passwort wiederholen
            <input id="new-password-confirm" type="password" minlength="10" autocomplete="new-password" placeholder="Noch einmal eingeben" required>
          </label>
          <button class="button button-primary club-submit" type="submit" id="reset-submit" disabled>Passwort ändern</button>
          <p class="club-auth-status" id="reset-status">Link wird geprüft…</p>
        </form>

        <div class="club-success" id="reset-success" hidden>
          <div class="club-success-icon">✓</div>
          <h3>Passwort geändert.</h3>
          <p>Dein neues Passwort ist aktiv. Du kannst dich jetzt mit deinem neuen Passwort anmelden.</p>
          <a class="button button-primary" href="/club.html">Zum ACY Club Login</a>
        </div>
      </section>
    </main>
  </div>
<footer class="legal-footer"><a href="/impressum.html">Impressum</a><span>·</span><a href="/datenschutz.html">Datenschutz</a></footer></body>
</html>
